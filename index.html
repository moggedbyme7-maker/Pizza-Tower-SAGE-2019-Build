<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pizza Tower SAGE 2019 Demo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        #canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            aspect-ratio: 16 / 9;
            width: 100vw;
            max-height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas" width="960" height="540"></canvas>
    
    <script>
        // Override GX environment variables before runner starts
        window.gamedata = {
            dataUrl: "assets/runner.data",
            wasmUrl: "assets/runner.wasm",
            unxUrl: "assets/game.unx"
        };
    </script>
    <script src="assets/runner.wasm"></script>
</body>
</html>
