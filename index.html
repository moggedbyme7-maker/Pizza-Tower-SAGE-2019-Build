<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Tower SAGE 2019</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            outline: none;
            border: 0;
        }
    </style>
</head>
<body>
    <canvas id="canvas" tabindex="1"></canvas>

    <script>
        var canvasElem = document.getElementById('canvas');
        
        window.addEventListener('click', function() { canvasElem.focus(); });
        window.addEventListener('DOMContentLoaded', function() { canvasElem.focus(); });

        Object.defineProperty(document, 'referrer', {
            get: function() { return 'https://gx.games/'; },
            configurable: true
        });

        var binaryUrl = "https://huggingface.co/datasets/Moggerd/pizza-tower-sage-build/resolve/main/game.unx";

        var originalOpen = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function(method, url) {
            if (typeof url === 'string' && url.includes('game.unx')) {
                url = binaryUrl;
            }
            return originalOpen.apply(this, arguments);
        };

        var originalFetch = window.fetch;
        window.fetch = function(resource, init) {
            if (typeof resource === 'string' && resource.includes('game.unx')) {
                resource = binaryUrl;
            } else if (resource instanceof Request && resource.url.includes('game.unx')) {
                resource = binaryUrl;
            }
            return originalFetch.call(this, resource, init);
        };

        window.manifestFiles = function() { return []; };
        window.g_pWadLoadCallback = function() {};
        window.setAddAsyncMethod = function() {};
        window.setPreloadMethod = function() {};
        window.setPostloadMethod = function() {};

        window.__assetsPath = function(path) {
            if (!path || path.includes('game.unx')) {
                return binaryUrl;
            }
            if (path.startsWith('http://') || path.startsWith('https://')) {
                return path;
            }
            return 'https://cdn.jsdelivr.net/gh/moggedbyme7-maker/Pizza-Tower-SAGE-2019-Build@main/assets/' + path;
        };

        var customWasmMemory = new WebAssembly.Memory({
            initial: 16384,
            maximum: 32768
        });

        var Module = {
            canvas: canvasElem,
            arguments: ["--game", binaryUrl],
            wasmMemory: customWasmMemory,
            locateFile: function(path) {
                return 'https://cdn.jsdelivr.net/gh/moggedbyme7-maker/Pizza-Tower-SAGE-2019-Build@main/assets/' + path;
            }
        };

        window.gamedata = {
            dataUrl: "https://cdn.jsdelivr.net/gh/moggedbyme7-maker/Pizza-Tower-SAGE-2019-Build@main/assets/runner.data",
            wasmUrl: "https://cdn.jsdelivr.net/gh/moggedbyme7-maker/Pizza-Tower-SAGE-2019-Build@main/assets/runner.wasm",
            unxUrl: binaryUrl
        };
    </script>

    <!-- Make sure this URL matches your GitHub repo structure -->
    <script src="https://cdn.jsdelivr.net/gh/moggedbyme7-maker/Pizza-Tower-SAGE-2019-Build@main/assets/runner.js"></script>
</body>
</html>
